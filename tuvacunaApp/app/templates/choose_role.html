{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div>
            <h2 class="mt-6 text-center text-3xl leading-9 font-extrabold text-gray-900">
                Seleccionar Rol
            </h2>
            <p class="mt-2 text-center text-sm leading-5 text-gray-600">
                Tu cuenta tiene múltiples roles asignados. Por favor selecciona cómo deseas ingresar.
            </p>
        </div>
        
        <form class="mt-8 bg-white py-8 px-10 shadow-lg sm:rounded-lg border border-gray-100" action="" method="POST">
            <div class="space-y-4">
                <button type="submit" name="role" value="patient" class="w-full btn-primary bg-green-600 hover:bg-green-500 focus:ring-green-500 active:bg-green-700">
                    Ingresar como Paciente
                </button>

                {% if es_especialista %}
                <button type="submit" name="role" value="especialista" class="w-full btn-primary bg-indigo-600 hover:bg-indigo-500 focus:ring-indigo-500 active:bg-indigo-700">
                    Ingresar como Especialista de Salud
                </button>
                {% endif %}

                {% if es_organizador %}
                <button type="submit" name="role" value="organizador" class="w-full btn-primary bg-blue-600 hover:bg-blue-500 focus:ring-blue-500 active:bg-blue-700">
                    Ingresar como Organizador
                </button>
                {% endif %}
            </div>
        </form>
    </div>
</div>
{% endblock %}
