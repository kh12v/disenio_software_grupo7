{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-gray-100">
        <div class="bg-blue-600 px-6 py-4">
            <h2 class="text-2xl font-bold text-white text-center">Solicitar Cita de Vacunación</h2>
        </div>
        
        <form class="p-8 space-y-6" method="POST">
            <div>
                <label for="campana_id" class="block text-sm font-medium text-gray-700">Selecciona la Campaña</label>
                <select id="campana_id" name="campana_id" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md" required>
                    <option value="" disabled selected>-- Elige una campaña --</option>
                    {% for c in campanas %}
                    <option value="{{ c.id }}">{{ c.nombre_campana }} ({{ c.enfermedad_objetivo }})</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="centro_id" class="block text-sm font-medium text-gray-700">Centro de Vacunación</label>
                <select id="centro_id" name="centro_id" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md" required>
                    <option value="" disabled selected>-- Elige un centro --</option>
                    {% for cv in centros %}
                    <option value="{{ cv.id }}">{{ cv.nombre_centro }} - {{ cv.direccion }}</option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label for="horario" class="block text-sm font-medium text-gray-700">Fecha y Hora Disponibles</label>
                <select id="horario" name="horario" class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm rounded-md" required>
                    <option value="" disabled selected>-- Elige un horario --</option>
                    {% for h in horarios %}
                    <option value="{{ h.fecha }} {{ h.hora }}">{{ h.fecha }} a las {{ h.hora }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="pt-4 flex justify-between">
                <a href="{{ url_for('patient_dashboard') }}" class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Cancelar
                </a>
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    Confirmar Cita
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const citasOcupadas = {{ citas_ocupadas_por_centro|tojson }};
        const centroSelect = document.getElementById('centro_id');
        const horarioSelect = document.getElementById('horario');
        
        function actualizarHorarios() {
            const centroId = centroSelect.value;
            const ocupadas = citasOcupadas[centroId] || [];
            
            for (let i = 0; i < horarioSelect.options.length; i++) {
                const option = horarioSelect.options[i];
                if (option.value === "") continue; // Skip placeholder
                
                if (ocupadas.includes(option.value)) {
                    option.disabled = true;
                    if (!option.text.includes("(Reservado)")) {
                        option.text = option.text + " (Reservado)";
                    }
                } else {
                    option.disabled = false;
                    option.text = option.text.replace(" (Reservado)", "");
                }
            }
            
            // Unselect if the currently selected option is now disabled
            if (horarioSelect.selectedIndex > 0 && horarioSelect.options[horarioSelect.selectedIndex].disabled) {
                horarioSelect.selectedIndex = 0;
            }
        }
        
        centroSelect.addEventListener('change', actualizarHorarios);
        
        // Ejecutar al cargar la página por si hay un centro pre-seleccionado
        if (centroSelect.value) {
            actualizarHorarios();
        }
    });
</script>
{% endblock %}
