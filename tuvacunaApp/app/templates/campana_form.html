{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
    <div class="bg-white shadow-xl rounded-lg overflow-hidden border border-blue-100">
        <div class="bg-blue-600 px-6 py-4">
            <h2 class="text-2xl font-bold text-white text-center">{{ title }}</h2>
        </div>
        
        <form class="p-8 space-y-6" method="POST">
            <div>
                <label for="nombre_campana" class="block text-sm font-medium text-gray-700">Nombre de la Campaña</label>
                <input type="text" id="nombre_campana" name="nombre_campana" required 
                       value="{{ campana.nombre_campana if campana else '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm px-3 py-2">
            </div>

            <div>
                <label for="enfermedad_objetivo" class="block text-sm font-medium text-gray-700">Enfermedad Objetivo</label>
                <input type="text" id="enfermedad_objetivo" name="enfermedad_objetivo" required
                       value="{{ campana.enfermedad_objetivo if campana else '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm px-3 py-2">
            </div>

            <div>
                <label for="poblacion_objetivo" class="block text-sm font-medium text-gray-700">Población Objetivo</label>
                <input type="text" id="poblacion_objetivo" name="poblacion_objetivo" required
                       value="{{ campana.poblacion_objetivo if campana else '' }}"
                       class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm px-3 py-2"
                       placeholder="Ej. Adultos mayores, Estudiantes, etc.">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label for="fecha_inicio" class="block text-sm font-medium text-gray-700">Fecha de Inicio</label>
                    <input type="date" id="fecha_inicio" name="fecha_inicio" required
                           value="{{ campana.fecha_inicio.strftime('%Y-%m-%d') if campana else '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm px-3 py-2">
                </div>
                <div>
                    <label for="fecha_fin" class="block text-sm font-medium text-gray-700">Fecha de Fin</label>
                    <input type="date" id="fecha_fin" name="fecha_fin" required
                           value="{{ campana.fecha_fin.strftime('%Y-%m-%d') if campana else '' }}"
                           class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm px-3 py-2">
                </div>
            </div>

            <div class="pt-4 flex justify-between">
                <a href="{{ url_for('organizador_dashboard') }}" class="inline-flex justify-center py-2 px-4 border border-gray-300 shadow-sm text-sm font-medium rounded-md text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Cancelar
                </a>
                <button type="submit" class="inline-flex justify-center py-2 px-4 border border-transparent shadow-sm text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Guardar Campaña
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
