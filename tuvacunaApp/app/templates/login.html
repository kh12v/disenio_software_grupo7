{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center bg-gray-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full">
        <div>
            <h2 class="mt-6 text-center text-3xl leading-9 font-extrabold text-gray-900">
                Inicia sesión en tu cuenta
            </h2>
            <p class="mt-2 text-center text-sm leading-5 text-gray-600">
                O
                <a href="{{ url_for('register') }}" class="font-medium text-blue-600 hover:text-blue-500 focus:outline-none focus:underline transition ease-in-out duration-150">
                    crear una cuenta nueva
                </a>
            </p>
        </div>
        
        <form class="mt-8 bg-white py-8 px-10 shadow-lg sm:rounded-lg border border-gray-100" action="" method="POST">
            <div class="rounded-md shadow-sm">
                <div class="mb-4">
                    <label for="rut" class="form-label">RUT</label>
                    <input id="rut" name="rut" type="text" required class="form-input" placeholder="Ej. 12.345.678-9" maxlength="12" pattern="^\d{1,2}\.\d{3}\.\d{3}-[\dkK]$" oninput="formatRUT(this)">
                </div>
                <div class="mb-6">
                    <label for="password" class="form-label">Clave única</label>
                    <input id="password" name="password" type="password" required class="form-input" placeholder="Ingresa tu clave única">
                </div>
            </div>

            <div class="mt-6 flex items-center justify-between">
                <div class="flex items-center">
                    <input id="remember_me" name="remember_me" type="checkbox" class="form-checkbox h-4 w-4 text-blue-600 transition duration-150 ease-in-out">
                    <label for="remember_me" class="ml-2 block text-sm leading-5 text-gray-900">
                        Recordarme
                    </label>
                </div>
            </div>

            <div class="mt-6">
                <button type="submit" class="w-full btn-primary">
                    Iniciar sesión
                </button>
            </div>
        </form>
    </div>
</div>

<script>
function formatRUT(input) {
    // Remove all non-alphanumeric characters except K
    let value = input.value.replace(/[^0-9kK]/g, '').toUpperCase().slice(0, 9);
    if (value.length === 0) {
        input.value = '';
        return;
    }
    
    // Separate body and dv
    let body = value.slice(0, -1);
    let dv = value.slice(-1);
    
    // Format body with dots
    if (body.length > 0) {
        body = body.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        input.value = body + '-' + dv;
    } else {
        input.value = dv;
    }
}
</script>
{% endblock %}
