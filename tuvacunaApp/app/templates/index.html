{% extends "base.html" %}

{% block content %}
<div class="bg-white overflow-hidden shadow-lg rounded-lg border border-gray-100 transition-all duration-300 hover:shadow-xl">
    <div class="px-4 py-5 sm:p-6 text-center">
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">Bienvenido a <span class="text-blue-600">TuVacuna</span></h1>
        <p class="mt-2 text-lg text-gray-600 mb-8 max-w-2xl mx-auto">
            Tu portal de confianza para la gestión de vacunas.
        </p>
        {% if current_user.is_authenticated %}
        <div class="bg-blue-50 rounded-lg p-6 inline-block shadow-inner border border-blue-100">
            <h2 class="text-xl font-bold text-blue-800 mb-2">¡Hola, {{ current_user.rut }}!</h2>
            <p class="text-blue-600">Has iniciado sesión de forma segura.</p>
        </div>
        {% else %}
        <div class="mt-6 flex justify-center space-x-4">
            <a href="{{ url_for('login') }}" class="btn-primary">Iniciar sesión</a>
            <a href="{{ url_for('register') }}" class="bg-white text-blue-600 font-bold py-2 px-4 rounded border border-blue-600 hover:bg-blue-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50 transition ease-in-out duration-150 shadow-sm">Crear cuenta</a>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
